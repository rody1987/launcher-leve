plugins { id 'com.android.application' }

android {
    namespace 'com.leve.launcher'
    compileSdk 34
    defaultConfig {
        applicationId "com.leve.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }
}
